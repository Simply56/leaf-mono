# Keeps the project (and therefore volume) names from before the move into the
# monorepo, instead of deriving them from the `api` directory name.
name: leaf-nest

services:
    app:
        build:
            context: ../..
            dockerfile: apps/api/Dockerfile
        pull_policy: build
        init: true
        restart: unless-stopped
        ports:
            - "${PORT:-3000}:3000"
        environment:
            LEAF_API_KEY: ${LEAF_API_KEY:?set LEAF_API_KEY in .env (see .env.example)}
            TINIFY_API_KEY: ${TINIFY_API_KEY:?set TINIFY_API_KEY in .env (see .env.example)}
        volumes:
            - db:/app/data
            - uploads:/app/static

volumes:
    db:
    uploads:
