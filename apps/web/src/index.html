<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Leaf</title>
        <base href="/" />
        <!-- The page background of each theme; ThemeService keeps them in sync with the toggle -->
        <meta
            name="theme-color"
            content="#eef3ee"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#101612"
            media="(prefers-color-scheme: dark)"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="manifest" href="manifest.webmanifest" />
        <script>
            // Apply the saved theme before Angular boots to avoid a flash
            try {
                const theme = localStorage.getItem("theme");
                if (theme === "light" || theme === "dark") {
                    document.documentElement.dataset.theme = theme;
                    const color = theme === "dark" ? "#101612" : "#eef3ee";
                    for (const meta of document.querySelectorAll(
                        'meta[name="theme-color"]',
                    )) {
                        meta.setAttribute("content", color);
                    }
                }
            } catch {}
        </script>
    </head>
    <body>
        <app-root></app-root>
        <noscript
            >Please enable JavaScript to continue using this
            application.</noscript
        >
    </body>
</html>
