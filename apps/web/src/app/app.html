@if (auth.key() == null) {
    <app-api-key />
} @else {
    <router-outlet />
}

@if (plants.error(); as message) {
    <div class="error-banner" role="alert">
        <span>{{ message }}</span>
        <button class="error-retry" (click)="plants.reload()">Try again</button>
        <button
            class="icon-button error-dismiss"
            (click)="plants.error.set(null)"
            aria-label="Dismiss error"
        >
            <app-icon name="close" />
        </button>
    </div>
}

<div class="toast-region" role="status" aria-live="polite">
    @if (toasts.toast(); as toast) {
        <div class="toast">
            <span>{{ toast.message }}</span>
            @if (toast.action; as action) {
                <button class="toast-action" (click)="toasts.runAction()">
                    {{ action.label }}
                </button>
            }
        </div>
    }
</div>
