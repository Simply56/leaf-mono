<div class="photo" [class.uploading]="uploading()">
    <img [src]="displaySrc()" [alt]="plant().name" />
    @if (uploading()) {
        <div class="photo-progress" role="status">
            <span class="spinner small"></span>
            <span class="visually-hidden">Uploading photo</span>
        </div>
    }
    <label class="photo-button">
        <input
            class="visually-hidden"
            type="file"
            accept="image/*"
            [disabled]="uploading()"
            (change)="onFileChosen($event)"
        />
        <app-icon name="camera" /> Change photo
    </label>
</div>
