<div class="plant-card" [class]="'tone-' + status.tone">
    <a class="plant-card-link" [routerLink]="['plant', plant.id]">
        <span class="plant-card-photo">
            <img [src]="plant.imagePath" alt="" loading="lazy" />
            <span
                class="level-bar"
                [style.--level]="status.level"
                aria-hidden="true"
            ></span>
        </span>
        <span class="plant-card-name">{{ plant.name }}</span>
        <span class="status-text">{{ status.label }}</span>
    </a>
    @if (status.daysSince === 0) {
        <span class="watered-mark" title="Watered today">
            <app-icon name="check" />
            <span class="visually-hidden">Watered today</span>
        </span>
    } @else {
        <button
            class="water-chip"
            [disabled]="pending()"
            (click)="water()"
            [attr.aria-label]="'Water ' + plant.name"
        >
            <app-icon name="droplet" />
        </button>
    }
</div>
