<div class="plant-row" [class]="'tone-' + status.tone">
    <a class="plant-row-link" [routerLink]="['plant', plant.id]">
        <span class="water-ring" [style.--level]="status.level">
            <img [src]="plant.imagePath" alt="" loading="lazy" />
        </span>
        <span class="plant-row-text">
            <span class="plant-row-name">{{ plant.name }}</span>
            <span class="status-text">{{ status.label }}</span>
        </span>
    </a>
    @if (status.daysSince === 0) {
        <span class="watered-mark" title="Watered today">
            <app-icon name="check" />
            <span class="visually-hidden">Watered today</span>
        </span>
    } @else {
        <button
            class="water-chip"
            [disabled]="pending()"
            (click)="water()"
            [attr.aria-label]="'Water ' + plant.name"
        >
            <app-icon name="droplet" /> Water
        </button>
    }
</div>
