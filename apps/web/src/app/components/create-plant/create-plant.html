<dialog
    #dialog
    class="dialog"
    aria-labelledby="create-plant-title"
    closedby="any"
>
    <form
        class="stack"
        (submit)="$event.preventDefault(); submit(nameInput.value)"
    >
        <h2 id="create-plant-title" class="dialog-title">Add a plant</h2>
        <label class="field-label" for="create-plant-name">Name</label>
        <input
            #nameInput
            id="create-plant-name"
            class="text-input"
            type="text"
            maxlength="255"
            autocomplete="off"
            required
        />
        <div class="dialog-actions">
            <button type="button" class="text-button" (click)="close()">
                Cancel
            </button>
            <button type="submit" class="primary-button" [disabled]="saving()">
                Add plant
            </button>
        </div>
    </form>
</dialog>
